name: CI Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  YARN_GLOBAL_FOLDER: ${{ runner.temp }}/yarn-berry

jobs:
  verify-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn & Electron build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/yarn-berry/cache
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-deps-electron-${{ hashFiles('yarn.lock', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-deps-electron-

      - name: Install dependencies (immutable)
        run: yarn install --immutable

      - name: Check code formatting
        run: yarn format:check

      - name: Run TypeScript & Vue typechecks
        run: yarn typecheck

      - name: Verify semantic CSS classes
        run: yarn check:classes

      - name: Verify architecture guardrails
        run: yarn check:arch

      - name: Run unit tests
        run: yarn test

      - name: Build production bundles & verify unpacked app
        run: yarn pack:dir

      - name: Run packaged Windows smoke test
        env:
          ORBIT_UPDATE_DISABLE_AUTO: '1'
        run: yarn exec playwright test packaged.spec.ts --output=test-results/packaged

      - name: Upload Playwright packaged test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-packaged-windows-test-results
          path: test-results/
          retention-days: 7

  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux native build & Electron runtime libraries
        run: |
          sudo apt-get update
          PKGS="build-essential python3 libsecret-1-dev libnotify4 libnss3 libxss1 libgbm1 xvfb"
          for pkg in libgtk-3-0t64 libgtk-3-0 libasound2t64 libasound2 libfuse2t64 libfuse2; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then PKGS="$PKGS $pkg"; fi
          done
          sudo apt-get install -y --no-install-recommends $PKGS

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn & Electron build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/yarn-berry/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-deps-electron-${{ hashFiles('yarn.lock', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-deps-electron-

      - name: Install dependencies (immutable)
        run: yarn install --immutable

      - name: Check code formatting
        run: yarn format:check

      - name: Run TypeScript & Vue typechecks
        run: yarn typecheck

      - name: Verify semantic CSS classes
        run: yarn check:classes

      - name: Verify architecture guardrails
        run: yarn check:arch

      - name: Run unit tests
        run: yarn test

      - name: Build production bundles & package Linux AppImage + deb
        run: yarn pack:linux

      - name: Verify Linux packaged binary files & AppImage/deb outputs
        run: |
          test -f release/latest-linux.yml
          ls -lh release/*.AppImage release/*.deb
          test -f release/linux-unpacked/resources/app.asar.unpacked/node_modules/better-sqlite3/prebuilds/linux-x64.node
          test -f release/linux-unpacked/resources/app.asar.unpacked/node_modules/node-pty/build/Release/pty.node

      - name: Run packaged Linux smoke test (Xvfb)
        env:
          ORBIT_UPDATE_DISABLE_AUTO: '1'
        run: xvfb-run -a yarn exec playwright test packaged.spec.ts --output=test-results/packaged

      - name: Upload Playwright packaged test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-packaged-linux-test-results
          path: test-results/
          retention-days: 7
