name: Release Windows Installer

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 v0.1.1 或 0.1.1；留空则使用 package.json 版本）'
        required: false
        type: string
      prerelease:
        description: '是否标记为预发布版 (Pre-release)'
        required: false
        default: false
        type: boolean
      draft:
        description: '仅保存为草稿 (Draft Release)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve and validate release metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $raw = if ($env:REF_TYPE -eq 'tag') {
            $env:REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $env:INPUT_VERSION.Trim()
          } else {
            (node -p "require('./package.json').version").Trim()
          }

          $version = $raw -replace '^[vV]+', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid SemVer version: '$raw'. Expected vX.Y.Z or X.Y.Z."
          }

          $tag = "v$version"
          $isPrerelease = if (($version -match '-') -or ($env:INPUT_PRERELEASE -eq 'true')) { 'true' } else { 'false' }
          $isDraft = if ($env:INPUT_DRAFT -eq 'true') { 'true' } else { 'false' }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "draft=$isDraft" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install dependencies (immutable)
        run: yarn install --immutable

      - name: Verify formatting, types, classes and unit tests
        run: |
          yarn format:check
          yarn typecheck
          yarn check:classes
          yarn test

      - name: Align package.json version with release tag
        env:
          TARGET_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $pkgVersion = (node -p "require('./package.json').version").Trim()
          if ($pkgVersion -ne $env:TARGET_VERSION) {
            Write-Host "Syncing package.json version ($pkgVersion -> $env:TARGET_VERSION) for release build..."
            node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = process.env.TARGET_VERSION; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n", "utf8");'
          }

      - name: Build Windows x64 NSIS installer and latest.yml
        run: yarn pack:win

      - name: Generate release SHA256SUMS.txt
        run: yarn release:checksums

      - name: Verify packaged ASAR binary via Playwright
        env:
          ORBIT_UPDATE_DISABLE_AUTO: '1'
        run: yarn exec playwright test packaged.spec.ts --output=test-results/packaged

      - name: Publish assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IS_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          IS_DRAFT: ${{ steps.meta.outputs.draft }}
        run: |
          $installer = "release/Graphite-Orbit-Setup-$env:VERSION.exe"
          $blockmap = "release/Graphite-Orbit-Setup-$env:VERSION.exe.blockmap"
          $yml = "release/latest.yml"
          $sums = "release/SHA256SUMS.txt"

          foreach ($file in @($installer, $blockmap, $yml, $sums)) {
            if (-not (Test-Path $file)) {
              throw "Expected release artifact missing: $file"
            }
          }

          $assets = @($installer, $blockmap, $yml, $sums)
          $exists = $false
          gh release view "$env:TAG" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $exists = $true }

          if ($exists) {
            gh release upload "$env:TAG" @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $releaseArgs = @(
              'release', 'create', $env:TAG,
              '--target', $env:GITHUB_SHA,
              '--title', "Graphite Orbit $env:TAG",
              '--generate-notes'
            )
            if ($env:IS_PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
            if ($env:IS_DRAFT -eq 'true') { $releaseArgs += '--draft' }
            $releaseArgs += $assets
            & gh @releaseArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload release artifacts for workflow audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphite-orbit-win-x64-${{ steps.meta.outputs.version }}
          path: |
            release/Graphite-Orbit-Setup-${{ steps.meta.outputs.version }}.exe
            release/Graphite-Orbit-Setup-${{ steps.meta.outputs.version }}.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            test-results/
          retention-days: 14
