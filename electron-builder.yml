appId: dev.graphite.orbit
productName: Graphite Orbit
npmRebuild: false
directories:
  output: release
publish:
  - provider: github
    owner: 1823616178
    repo: termius-app
    releaseType: release
electronLanguages:
  - zh-CN
  - en-US
files:
  - out/**
  - package.json
  - '!node_modules/vue/**'
  - '!node_modules/@vue/**'
  - '!node_modules/@xterm/**'
  - '!node_modules/@lucide/**'
  - '!node_modules/three/**'
  - '!node_modules/zod/**'
  - '!node_modules/**/*.{d.ts,d.cts,d.mts,map,md,markdown,tsbuildinfo,test.js,test.cjs,test.mjs}'
  - '!node_modules/**/{.eslint*,README*,CHANGELOG*,HISTORY*,CONTRIBUTING*}'
  - '!node_modules/{node-gyp,tar,undici,minipass,minizlib,semver,tinyglobby,fdir,picomatch,which,isexe,nopt,proc-log,graceful-fs,env-paths,exponential-backoff,chownr,nan,node-addon-api,buildcheck,@isaacs}/**'
  - '!node_modules/**/node_modules/node-addon-api/**'
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/build/Release/obj/**'
  - '!node_modules/better-sqlite3/prebuilds/darwin-*'
  - '!node_modules/better-sqlite3/prebuilds/linux-arm64.node'
  - '!node_modules/better-sqlite3/prebuilds/linuxmusl-*'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
  - '!node_modules/node-pty/src/**'
  - '!node_modules/node-pty/deps/**'
  - '!node_modules/node-pty/scripts/**'
  - '!node_modules/node-pty/third_party/**'
  - '!node_modules/node-pty/build/Release/obj/**'
  - '!node_modules/node-pty/build/Release/obj.target/**'
  - '!node_modules/node-pty/prebuilds/win32-arm64/**'
  - '!node_modules/node-pty/prebuilds/darwin-*'
  - '!node_modules/cpu-features/.github/**'
  - '!node_modules/cpu-features/deps/**'
  - '!node_modules/cpu-features/src/**'
  - '!node_modules/cpu-features/test/**'
  - '!node_modules/cpu-features/build/deps/**'
  - '!node_modules/cpu-features/build/binding.sln'
  - '!node_modules/cpu-features/build/config.gypi'
  - '!node_modules/cpu-features/build/*.vcxproj*'
  - '!node_modules/cpu-features/build/Release/obj/**'
  - '!node_modules/cpu-features/buildcheck.*'
  - '!node_modules/cpu-features/install.js'
  - '!node_modules/ssh2/install.js'
  - '!node_modules/ssh2/util/build_pagent.bat'
  - '!node_modules/**/*.{c,cc,cpp,h,hpp,pdb,ipdb,iobj,lib,exp,vcxproj,filters,tlog,recipe}'
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/better-sqlite3/**
  - node_modules/cpu-features/**
  - node_modules/ssh2/**/*.node
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  signExecutable: false
nsis:
  artifactName: Graphite-Orbit-Setup-${version}.${ext}
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  icon: resources/icon.png
  category: Development
  maintainer: Graphite Orbit contributors <orbit@graphite.dev>
  synopsis: 跨平台 SSH 与本地终端工作台
  description: 跨平台 SSH 与本地终端工作台，支持多标签分屏、安全凭据存储与端到端加密同步。
  executableName: graphite-orbit
  desktop:
    entry:
      Name: Graphite Orbit
      Comment: Cross-platform SSH & Local Terminal Workbench
      Categories: Development;Utility;TerminalEmulator;
      Keywords: ssh;terminal;pty;orbit;
      StartupWMClass: Graphite Orbit
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
appImage:
  artifactName: Graphite-Orbit-${version}-linux-${arch}.${ext}
deb:
  artifactName: Graphite-Orbit-${version}-linux-${arch}.${ext}
  recommends:
    - libsecret-1-0
    - gnome-keyring
